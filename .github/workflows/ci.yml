name: ci

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'qpkg/qpkg.cfg'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'qpkg/qpkg.cfg'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Validate QPKG WebUI proxy contract
        shell: bash
        run: |
          set -euo pipefail
          webui="$(sed -n 's/^QPKG_WEBUI="\([^"]*\)".*/\1/p' qpkg/qpkg.cfg | head -n1)"
          use_proxy="$(sed -n 's/^QPKG_USE_PROXY="\([^"]*\)".*/\1/p' qpkg/qpkg.cfg | head -n1)"
          proxy_path="$(sed -n 's/^QPKG_PROXY_PATH="\([^"]*\)".*/\1/p' qpkg/qpkg.cfg | head -n1)"
          test -n "${webui}"
          if [[ "${use_proxy}" == "1" ]]; then
            test -n "${proxy_path}"
            test "${webui}" = "${proxy_path}"
          fi
      - run: go test ./...
      - run: go vet ./...
      - name: Verify static QNAP binary builds
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/docExtractor ./cmd/docextractor
