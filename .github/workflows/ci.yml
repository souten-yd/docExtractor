name: ci

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'internal/web/static/**'
      - 'go.mod'
      - 'go.sum'
      - 'qpkg/qpkg.cfg'
      - 'qpkg/icons/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'internal/web/static/**'
      - 'go.mod'
      - 'go.sum'
      - 'qpkg/qpkg.cfg'
      - 'qpkg/icons/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Validate QPKG WebUI proxy contract
        shell: bash
        run: |
          set -euo pipefail
          webui="$(sed -n 's/^QPKG_WEBUI="\([^"]*\)".*/\1/p' qpkg/qpkg.cfg | head -n1)"
          use_proxy="$(sed -n 's/^QPKG_USE_PROXY="\([^"]*\)".*/\1/p' qpkg/qpkg.cfg | head -n1)"
          proxy_path="$(sed -n 's/^QPKG_PROXY_PATH="\([^"]*\)".*/\1/p' qpkg/qpkg.cfg | head -n1)"
          test -n "${webui}"
          if [[ "${use_proxy}" == "1" ]]; then
            test -n "${proxy_path}"
            test "${webui}" = "${proxy_path}"
          fi
      - name: Validate QNAP icon files
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          expected = {
              Path('qpkg/icons/docExtractor.png'): (64, 64),
              Path('qpkg/icons/docExtractor_80.png'): (80, 80),
              Path('qpkg/icons/docExtractor_gray.png'): (64, 64),
          }
          for path, size in expected.items():
              raw = path.read_bytes()
              if raw[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path}: not a PNG')
              dims = struct.unpack('>II', raw[16:24])
              if dims != size:
                  raise SystemExit(f'{path}: {dims}, expected {size}')
              print(f'{path}: {dims[0]}x{dims[1]} OK')
          PY
      - name: Validate embedded update UI
        run: |
          grep -q 'アプリ更新' internal/web/static/index.html
          grep -q 'X-docExtractor-Confirm' internal/web/static/index.html
      - run: go test ./...
      - run: go vet ./...
      - name: Verify static QNAP binary builds
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/docExtractor ./cmd/docextractor
