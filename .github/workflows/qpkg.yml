name: qpkg

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: qpkg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Resolve dependency checksum
        run: go mod download -json github.com/nwaples/rardecode/v2@v2.4.1
      - run: go mod verify
      - name: Build static x86_64 binary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p qpkg/x86_64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=mod -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o qpkg/x86_64/docExtractor ./cmd/docextractor
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
            sed -i "s/^QPKG_VER=.*/QPKG_VER=\"${PACKAGE_VERSION}\"/" qpkg/qpkg.cfg
          fi
      - name: Install QDK only for package builds
        run: |
          curl -fsSL -o /tmp/qdk.deb \
            https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
      - name: Build QPKG
        run: |
          cd qpkg
          qbuild --build-arch x86_64
          mkdir -p ../dist
          find build -type f -name '*.qpkg' -exec cp {} ../dist/ \;
          test -n "$(find ../dist -type f -name '*.qpkg' -print -quit)"
      - name: Publish tagged release without Actions artifact storage
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*.qpkg --clobber
      - name: Upload manual build briefly
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: docExtractor-qpkg
          path: dist/*.qpkg
          retention-days: 1
