name: qpkg

on:
  workflow_dispatch:
  pull_request:
    types: [edited]
  push:
    tags:
      - 'v*'

concurrency:
  group: qpkg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.body, '[qpkg-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Build static x86_64 binary
        env:
          VERSION: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
        run: |
          mkdir -p qpkg/x86_64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o qpkg/x86_64/docExtractor ./cmd/docextractor
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
            sed -i "s/^QPKG_VER=.*/QPKG_VER=\"${PACKAGE_VERSION}\"/" qpkg/qpkg.cfg
          fi
      - name: Install QDK only for package builds
        run: |
          curl -fsSL -o /tmp/qdk.deb \
            https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
      - name: Build and validate QPKG
        run: |
          cd qpkg
          qbuild --strict --build-arch x86_64
          mkdir -p ../dist
          find build -type f -name '*.qpkg' -exec cp {} ../dist/ \;
          QPKG_FILE="$(find ../dist -type f -name '*.qpkg' -print -quit)"
          test -n "$QPKG_FILE"
          qbuild --query info "$QPKG_FILE"
          ls -lh "$QPKG_FILE"
      - name: Publish tagged release without Actions artifact storage
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*.qpkg --clobber
      - name: Upload non-release build briefly
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docExtractor-qpkg
          path: dist/*.qpkg
          retention-days: 1
