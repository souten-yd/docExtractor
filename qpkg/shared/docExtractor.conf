LISTEN="0.0.0.0:8765"
# Default QNAP share used only until a Web-saved setting exists.
ROOT="/share/Download/Temp"
# Folder picker is restricted to this tree.
BROWSE_ROOT="/share"
# Persistent Web settings live outside the QPKG install directory so upgrades keep them.
SETTINGS_FILE="/etc/config/docExtractor.settings.json"
# TS-253Be J3455 default. Supported range is 1-3.
WORKERS="2"
# RAM stream buffer per worker; archives are never read fully into RAM.
BUFFER_MIB="8"
# Bound decoder dictionary memory independently from file size.
MAX_DICT_MIB="512"
# fast | balanced | compact
COMPRESSION="balanced"
# 0 = central-directory verification, 1 = read every generated ZIP entry.
FULL_VERIFY="0"
