LISTEN="127.0.0.1:8765"
# QNAP share containing incoming .zip/.rar files.
ROOT="/share/Download/Temp"
# TS-253Be J3455 default. Supported range is 1-3.
WORKERS="2"
# RAM stream buffer per worker; archives are never read fully into RAM.
BUFFER_MIB="8"
# Bound decoder dictionary memory independently from file size.
MAX_DICT_MIB="512"
# fast | balanced | compact
COMPRESSION="balanced"
# 0 = central-directory verification, 1 = read every generated ZIP entry.
FULL_VERIFY="0"
